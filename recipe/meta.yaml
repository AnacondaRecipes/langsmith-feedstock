{% set name = "langsmith" %}
{% set version = "0.14.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 294a02addc2358fab390156b74fa942e2dd40b711f6507c5f26b5c208cc89e15

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed -vv
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - pydantic >=2,<3
    - requests >=2.0.0
    - orjson >=3.9.14
    - httpx2 >=2,<3
    - requests-toolbelt >=1.0.0
    - zstandard >=0.23.0
    - packaging >=23.2
    - uuid-utils >=0.12.0,<1.0
    - python-xxhash >=3.0.0
    - websockets >=15.0
    - anyio >=3.5.0
    - distro >=1.7.0
    - sniffio >=1.1
    - typing_extensions >=4.0.0
  run_constrained:
    # langsmith_pyo3
    - langsmith-pyo3 >=0.1.0rc2
    # otel
    - opentelemetry-sdk >=1.30.0
    - opentelemetry-api >=1.30.0
    - opentelemetry-exporter-otlp-proto-http >=1.30.0
    # pipecat
    - pipecat-ai >=1.0  # [py>=311]
    - cachetools >=5.0.0
    # livekit
    - livekit-agents >=1.6
    # openai-realtime
    - openai >=1.50
    - openai-agents >=0.0.3
    # gemini-live
    - google-genai >=1.75
    # claude-agent-sdk
    - claude-agent-sdk>=0.1.0  # [py<=310]
    # google-adk
    #- google-adk >=1.0.0
    - wrapt >=1.16.0
    # google-adk-live
    - google-adk >=2.3.0
    # strands-agents
    - strands-agents >=0.1.0
    - strands-agents-tools >=0.2.0
    # vcr
    - vcrpy >=7.0.0
    
# Root conftest.py (from the sdist) registers --vcr-mode; include it in source_files
# so pytest loads it when running `pytest tests/` from the test prefix.
# tests/integration_tests (incl. wrappers/) needs a live LangSmith backend + API key
# (e.g. 401 Client Error: Unauthorized for url: https://api.smith.langchain.com/...);
# skip that subtree — core client behavior is covered by unit_tests.
{% set ignore_tests = " --ignore=tests/integration_tests" %}
# E   openai.OpenAIError: The api_key client option must be set either by passing api_key to the client or by setting the OPENAI_API_KEY environment variable
{% set ignore_tests = ignore_tests + " --ignore=tests/external/test_instructor_evals.py" %}
# deepagents has no main-channel build — skip the deepagents compat test.
{% set ignore_tests = ignore_tests + " --ignore=tests/external/test_deepagent_compat.py" %}
# E requests.exceptions.HTTPError: 401 Client Error: Unauthorized for url: https://api.smith.langchain.com/...
{% set ignore_tests = ignore_tests + " --ignore=tests/evaluation/test_evaluation.py" %}
# pytest-httpx has no main-channel build — skip the sandbox tests that import it.
{% set ignore_tests = ignore_tests + " --ignore=tests/unit_tests/sandbox/test_access_delegation.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/unit_tests/sandbox/test_async_client.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/unit_tests/sandbox/test_async_sandbox.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/unit_tests/sandbox/test_aws_role_auth.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/unit_tests/sandbox/test_client.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/unit_tests/sandbox/test_proxy_config.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/unit_tests/sandbox/test_run_config_and_files.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/unit_tests/sandbox/test_sandbox.py" %}
# strands-agents has no main-channel build — skip the strands integration unit test.
{% set ignore_tests = ignore_tests + " --ignore=tests/unit_tests/wrappers/test_strands_agents.py" %}
# google-adk has no main-channel build — skip the Google ADK integration unit test.
{% set ignore_tests = ignore_tests + " --ignore=tests/unit_tests/wrappers/test_google_adk.py" %}
test:
  source_files:
    - tests
    - conftest.py
    - bench
  imports:
    - langsmith
    - langsmith._expect
    - langsmith._internal
    - langsmith.anonymizer
    - langsmith.async_client
    - langsmith.beta._evals
    - langsmith.client
    - langsmith.env
    - langsmith.evaluation
    - langsmith.middleware
    - langsmith.run_helpers
    - langsmith.run_trees
    - langsmith.schemas
    - langsmith.utils
    - langsmith.wrappers
  requires:
    - pip
    - pytest >=7.0.0
    - pytest-asyncio >=0.21.0
    - vcrpy >=7.0.0
    - langchain-core >=1.0.0
    - opentelemetry-sdk >=1.30.0
    - opentelemetry-api >=1.30.0
    - opentelemetry-exporter-otlp-proto-http >=1.30.0
    - anthropic >=0.45.0
    - pytest-tornasync
    - dataclasses-json >=0.6.4
    - multipart
    - attrs
    - cachetools >=5.0.0
    - pytest-socket >=0.7.0
    # Pin to upstream's own dev-group ceiling (pyproject.toml): newer ChatAnthropic
    # releases changed bind_tools()'s serialized kwargs shape, breaking the
    # pull/push prompt round-trip fixtures in test_client.py.
    - langchain-anthropic >=1.0.0,<1.5.0
    - langchain-openai >=1.0.0,<1.4.0
    # integration_tests (VCR cassettes; see --vcr-mode=none below)
    - freezegun >=1.2.0
    - fastapi >=0.115.0
    - uvicorn >=0.29.0
    - openai >=1.0.0
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # --vcr-mode=none: replay committed cassettes only (no live AI API record) in CI.
    # langsmith's own client code imports httpx2 as `httpx`, but several test modules
    # still `import httpx` directly (pre-dating the httpx2 migration); alias_httpx()
    # makes that resolve to httpx2 process-wide, matching upstream's own test setup
    # (see tests/httpx2_alias/sitecustomize.py + PYTHONPATH in upstream's Makefile).
    - python -c "import httpx2; httpx2.alias_httpx(); import pytest, sys; sys.exit(pytest.main(sys.argv[1:]))" -v tests {{ ignore_tests }} --vcr-mode=none

about:
  home: https://smith.langchain.com
  summary: Client library to connect to the LangSmith Observability and Evaluation Platform.
  description: |
    LangSmith helps you visualize and evaluate language model applications to help you build better
    performing applications. This is the client library to connect to the LangSmith API.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://docs.smith.langchain.com
  dev_url: https://github.com/langchain-ai/langsmith-sdk

extra:
  recipe-maintainers:
    - pavelzw
    - hinthornw
    - vowelparrot
