{% set name = "langsmith" %}
{% set version = "0.10.9" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 195bc67c964a6370cb91742ce9fa07ce69bfae47977f0fb3f41d125b3435d03a

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed -vv
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - pydantic >=2,<3
    - requests >=2.0.0
    - orjson >=3.9.14
    - httpx >=0.23.0,<1
    - requests-toolbelt >=1.0.0
    - zstandard >=0.23.0
    - packaging >=23.2
    - uuid-utils >=0.12.0,<1.0
    - python-xxhash >=3.0.0
    - websockets >=15.0
    - anyio>=3.5.0
    - distro >=1.7.0
    - sniffio >=1.1
    - typing_extensions >=4.0.0
  run_constrained:
    # langsmith_pyo3
    - langsmith-pyo3 >=0.1.0
    # otel
    - opentelemetry-sdk >=1.30.0
    - opentelemetry-api >=1.30.0
    - opentelemetry-exporter-otlp-proto-http >=1.30.0
    # pipecat
    - pipecat-ai >=1.0  # [py>=311]
    - cachetools >=5.0.0
    # livekit
    - livekit-agents >=1.0
    # openai-realtime
    - openai >=1.50
    - openai-agents >=0.0.3
    # claude-agent-sdk
    - claude-agent-sdk>=0.1.0  # [py<=310]
    # google-adk
    #- google-adk >=1.0.0
    - wrapt >=1.16.0
    # google-adk-live
    - google-adk >=2.3.0
    # strands-agents
    - strands-agents >=0.1.0
    - strands-agents-tools >=0.2.0
    # vcr
    - vcrpy >=7.0.0
    
# Root conftest.py (from the sdist) registers --vcr-mode; include it in source_files
# so pytest loads it when running `pytest tests/` from the test prefix.
# Optional-provider integration wrappers (Azure, Gemini, Google ADK, strands, …) need
# many extra conda packages — skip that subtree; core integration runs with VCR cassettes.
{% set ignore_tests = " --ignore=tests/integration_tests/wrappers" %}
# E   openai.OpenAIError: The api_key client option must be set either by passing api_key to the client or by setting the OPENAI_API_KEY environment variable
{% set ignore_tests = ignore_tests + " --ignore=tests/external/test_instructor_evals.py" %}
# E requests.exceptions.HTTPError: 401 Client Error: Unauthorized for url: https://api.smith.langchain.com/...
{% set ignore_tests = ignore_tests + " --ignore=tests/evaluation/test_evaluation.py" %}
# dataclasses-json has no main-channel build for Python 3.14+ — skip tests that import it.
{% set ignore_tests = ignore_tests + " --ignore=tests/unit_tests/test_utils.py" %}  # [py>=314]
  source_files:
    - tests
    - conftest.py
  imports:
    - langsmith
    - langsmith._expect
    - langsmith._internal
    - langsmith.anonymizer
    - langsmith.async_client
    - langsmith.beta._evals
    - langsmith.client
    - langsmith.env
    - langsmith.evaluation
    - langsmith.middleware
    - langsmith.run_helpers
    - langsmith.run_trees
    - langsmith.schemas
    - langsmith.utils
    - langsmith.wrappers
  requires:
    - pip
    - pytest >=7.0.0
    - pytest-asyncio >=0.21.0
    - vcrpy >=7.0.0
    - langchain-core >=1.0.0
    - opentelemetry-sdk >=1.30.0
    - opentelemetry-api >=1.30.0
    - opentelemetry-exporter-otlp-proto-http >=1.30.0
    - anthropic >=0.45.0
    - pytest-tornasync
    - dataclasses-json >=0.6.4  # [py<314]
    - multipart
    - attrs
    # integration_tests (VCR cassettes; see --vcr-mode=none below)
    - freezegun >=1.2.0
    - fastapi >=0.115.0
    - uvicorn >=0.29.0
    - openai >=1.0.0
    - openai-agents >=0.0.3
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # --vcr-mode=none: replay committed cassettes only (no live AI API record) in CI.
    - pytest -v tests {{ ignore_tests }} --vcr-mode=none

about:
  home: https://smith.langchain.com
  summary: Client library to connect to the LangSmith Observability and Evaluation Platform.
  description: |
    LangSmith helps you visualize and evaluate language model applications to help you build better
    performing applications. This is the client library to connect to the LangSmith API.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://docs.smith.langchain.com
  dev_url: https://github.com/langchain-ai/langsmith-sdk

extra:
  recipe-maintainers:
    - pavelzw
    - hinthornw
    - vowelparrot
