{% set name = "langsmith" %}
{% set version = "0.14.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 294a02addc2358fab390156b74fa942e2dd40b711f6507c5f26b5c208cc89e15

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed -vv
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - pydantic >=2,<3
    - requests >=2.0.0
    - orjson >=3.9.14
    - httpx2 >=2,<3
    - requests-toolbelt >=1.0.0
    - zstandard >=0.23.0
    - packaging >=23.2
    - uuid-utils >=0.12.0,<1.0
    - python-xxhash >=3.0.0
    - websockets >=15.0
    - anyio >=3.5.0
    - distro >=1.7.0
    - sniffio >=1.1
    - typing_extensions >=4.0.0
  run_constrained:
    # langsmith_pyo3
    - langsmith-pyo3 >=0.1.0rc2
    # otel
    - opentelemetry-sdk >=1.30.0
    - opentelemetry-api >=1.30.0
    - opentelemetry-exporter-otlp-proto-http >=1.30.0
    # pipecat
    - pipecat-ai >=1.0  # [py>=311]
    - cachetools >=5.0.0
    # livekit
    - livekit-agents >=1.6
    # openai-realtime
    - openai >=1.50
    - openai-agents >=0.0.3
    # gemini-live
    - google-genai >=1.75
    # claude-agent-sdk: python_version>='3.10' in pyproject.toml, which every
    # build we ship already satisfies (build/skip: true # [py<310] above) —
    # no selector needed. Previously had an inverted [py<=310] selector that
    # silently dropped this constraint for py311+ builds.
    - claude-agent-sdk >=0.1.0
    # pytest extra
    - pytest >=7.0.0
    - rich >=13.9.4
    # google-adk
    #- google-adk >=1.0.0
    - wrapt >=1.16.0
    # google-adk-live
    - google-adk >=2.3.0
    # strands-agents
    - strands-agents >=0.1.0
    - strands-agents-tools >=0.2.0
    # vcr
    - vcrpy >=7.0.0

test:
  # recipe/run_test.py runs the pytest suite (ignore/deselect lists and the
  # httpx2 aliasing live there); conda-build executes it automatically as part
  # of the test phase. conftest.py registers --vcr-mode; source_files ships the
  # sdist test-support files that aren't part of the installed wheel.
  source_files:
    - tests
    - conftest.py
    - bench
  imports:
    - langsmith
    - langsmith._expect
    - langsmith._internal
    - langsmith.anonymizer
    - langsmith.async_client
    - langsmith.beta._evals
    - langsmith.client
    - langsmith.env
    - langsmith.evaluation
    - langsmith.middleware
    - langsmith.run_helpers
    - langsmith.run_trees
    - langsmith.schemas
    - langsmith.utils
    - langsmith.wrappers
  requires:
    - pip
    - pytest >=7.0.0
    - pytest-asyncio >=0.21.0
    - vcrpy >=7.0.0
    # Same upstream dev-group ceiling as langchain-anthropic/-openai below.
    - langchain-core >=1.0.0,<1.5.0
    - opentelemetry-sdk >=1.30.0
    - opentelemetry-api >=1.30.0
    - opentelemetry-exporter-otlp-proto-http >=1.30.0
    - anthropic >=0.45.0
    - pytest-tornasync
    - dataclasses-json >=0.6.4
    - multipart >=1.0.0
    - attrs
    - cachetools >=5.0.0
    - pytest-socket >=0.7.0
    - pytest-rerunfailures >=14.0
    # Pinned to upstream's own dev-group ceiling (pyproject.toml). Confirmed
    # necessary for langchain-anthropic: newer ChatAnthropic releases changed
    # bind_tools()'s serialized kwargs shape, breaking the pull/push prompt
    # round-trip fixtures in test_client.py. langchain-openai capped to match.
    - langchain-anthropic >=1.0.0,<1.5.0
    - langchain-openai >=1.0.0,<1.4.0
    # integration_tests (VCR cassettes; see run_test.py's --vcr-mode=none)
    - freezegun >=1.2.0
    - fastapi >=0.115.0
    - uvicorn >=0.29.0
    - openai >=1.0.0
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # run_test.py (in this recipe dir) runs the actual pytest suite.

about:
  home: https://smith.langchain.com
  summary: Client library to connect to the LangSmith Observability and Evaluation Platform.
  description: |
    LangSmith helps you visualize and evaluate language model applications to help you build better
    performing applications. This is the client library to connect to the LangSmith API.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://docs.smith.langchain.com
  dev_url: https://github.com/langchain-ai/langsmith-sdk

extra:
  recipe-maintainers:
    - pavelzw
    - hinthornw
    - vowelparrot
